# Publishes the GitHub release with the installer attached.
# - pushing a new tag (v*) creates a release for it
# - pushing changes to the notes or the installer on main refreshes the latest release in place
name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['RELEASE_NOTES.md', 'website/downloads/WinIslandSetup.exe', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG=$(gh release view --json tagName -q .tagName); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WinIsland" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" website/downloads/WinIslandSetup.exe --clobber
          else
            gh release create "$TAG" website/downloads/WinIslandSetup.exe --title "WinIsland" --notes-file RELEASE_NOTES.md --latest
          fi
