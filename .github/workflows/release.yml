# Pushing a tag like v2.0.0 creates the GitHub release with the installer attached.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" website/downloads/WinIslandSetup.exe \
            --title "WinIsland ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --latest
