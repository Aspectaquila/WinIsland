[package]
name = "wgc-capture"
version = "0.1.0"
edition = "2021"
description = "Website screenshots of WinIsland: Windows.Graphics.Capture with real alpha, island + glow composite, tight crop"

[dependencies]
image = { version = "0.25.1", default-features = false, features = ["png"] }
png = "0.18"

[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
]

[profile.release]
opt-level = 3
